<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz</title><link rel="stylesheet" href="style.css"></head>
<body class="app-body">
<aside class="sidebar">
	<h2 class="sidebar-brand"><span class="brand-mark" aria-hidden="true">E</span><span>EduNova</span></h2><div class="user">👧🏻 <b>Hello, <span data-user-name>Ananya</span>!</b><small>Level <span data-user-level>1</span> Learner</small></div>
	<nav><a href="dashboard.html">🏠 Home</a><a class="active" href="subjects.html">📖 Subjects</a><a href="quests.html">♕ Quests</a><a href="leaderboard.html">🏆 Leaderboard</a><a href="awards.html">🎁 Awards</a><a href="progress.html">📈 Progress</a><a href="profile.html">👤 Profile</a><a href="settings.html">⚙ Settings</a></nav>

<div class="quiz-page">
<header class="quiz-top game-quiz-top"><div><span class="eyebrow" id="quiz-topic">FRACTIONS · WORLD 1</span><b>Level 1</b></div><div class="quiz-progress"><span id="quiz-progress-bar"></span></div><b id="quiz-counter">1 / 50</b><span class="quiz-xp">⭐ +10 XP</span><button onclick="speakQuestion()" title="Read question aloud">🔊</button></header>
<section class="question-card">
<div class="question-meta"><span id="question-label">QUEST 05</span><span>🔥 <span id="quiz-streak">0</span> day streak</span></div><h2 id="question-prompt">Which answer unlocks the next path?</h2><h3 id="question-text">2/5 + 1/10 = ?</h3>
<button class="answer" data-choice="0" onclick="checkAnswer(this)">A　<span></span></button>
<button class="answer" data-choice="1" onclick="checkAnswer(this)">B　<span></span></button>
<button class="answer" data-choice="2" onclick="checkAnswer(this)">C　<span></span></button>
<button class="answer" data-choice="3" onclick="checkAnswer(this)">D　<span></span></button>
<div id="result" class="result">⭐ Great! Correct Answer<br><b>+10 XP</b></div>
<div id="ai-coach" class="ai-coach" hidden><strong>🤖 AI Coach</strong><p></p></div>
<div class="quiz-actions"><button onclick="showExplanation()">💡 Explanation</button><button class="ai-button" onclick="askAiCoach()">🤖 Ask AI Coach</button><button onclick="nextQuestion()">Next Question →</button></div>
</section>
</div>
<script src="script.js"></script>
</body>
